services:
  db:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${DB_NAME:-myri}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-myri_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-myri_migration}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql/01-create-users.sh:/docker-entrypoint-initdb.d/01-create-users.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${DB_PASSWORD}\" mysql --protocol=TCP -h127.0.0.1 -u\"$${DB_USERNAME}\" --silent --skip-column-names -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Rome}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/config.json"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-myri}
      DB_USERNAME: ${DB_USERNAME:-myri_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-myri_migration}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env}
      APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Rome}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      CAREER_TALK_MONTHS: ${CAREER_TALK_MONTHS:-3}
      REMINDERS_INTERVAL_MS: ${REMINDERS_INTERVAL_MS:-60000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - application
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

networks:
  database:
    internal: true
  application:

volumes:
  mysql_data:
