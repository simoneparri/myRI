spring:
  application:
    name: myri
  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:myri}?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    clean-disabled: true
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
      tracking-modes: cookie
logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.springframework.web: WARN
myri:
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    career-months: ${CAREER_TALK_MONTHS:3}
    interval-ms: ${REMINDERS_INTERVAL_MS:60000}
  zone: ${APP_TIMEZONE:Europe/Rome}
  bootstrap:
    username: ${APP_USERNAME:}
    password: ${APP_PASSWORD:}
  reset-password: false
  reset-password-value: ${APP_RESET_PASSWORD:}
