@if (actions().length > 1) {
  <button mat-icon-button [matMenuTriggerFor]="menu" [disabled]="disabled()" aria-label="Azioni">
    <svg appButtonIcon="menu"></svg>
  </button>
  <mat-menu #menu="matMenu">
    @for (action of actions(); track action.key) {
      @if (action.link) {
        <a mat-menu-item [routerLink]="action.link" [disabled]="disabled()">
          <svg [appButtonIcon]="action.icon"></svg>{{ action.label }}
        </a>
      } @else {
        <button mat-menu-item (click)="selected.emit(action.key)" [disabled]="disabled()">
          <svg [appButtonIcon]="action.icon"></svg>{{ action.label }}
        </button>
      }
    }
  </mat-menu>
} @else {
  @for (action of actions(); track action.key) {
    @if (action.link) {
      <a mat-button [routerLink]="action.link" [disabled]="disabled()">
        <svg [appButtonIcon]="action.icon"></svg>{{ action.label }}
      </a>
    } @else {
      <button mat-button (click)="selected.emit(action.key)" [disabled]="disabled()">
        <svg [appButtonIcon]="action.icon"></svg>{{ action.label }}
      </button>
    }
  }
}
